<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PICO MR Bilder</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    font-family: Arial, sans-serif;

}


#menu {

    position: fixed;

    z-index: 100;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,0.75);

    color: white;

    padding: 15px;

    border-radius: 15px;

    text-align: center;

}


#menu button {

    margin: 5px;

    padding: 10px 15px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

}


#status {

    margin-top: 8px;

    font-size: 14px;

    opacity: 0.8;

}


#start {

    background: #9b59ff;

    color: white;

    font-weight: bold;

}


canvas {

    display: block;

}

</style>

</head>


<body>


<div id="menu">

    <button id="motif1">
        Mein Motiv
    </button>

    <button id="motif2">
        Motiv Mom
    </button>

    <br>

    <button id="start">
        🥽 MR starten
    </button>

    <div id="status">
        Motiv 1 | 2 × 2 m | nicht festgestellt
    </div>

</div>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BILDER
   ===================================================== */

const IMAGES = {

    1:
    "6E99D71F-9688-4AF0-BDFA-5764592FE23A.PNG",

    2:
    "20Bec6d6-c4fe-4a7d-9ef4-fc91983068c.JPG"

};


/* =====================================================
   SZENE
   ===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.01,

        100

    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    window.devicePixelRatio
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled = true;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   BILD
   ===================================================== */

const pictureGroup =
    new THREE.Group();


scene.add(
    pictureGroup
);


let picture = null;


/* =====================================================
   BILD-EINSTELLUNGEN
   ===================================================== */

let currentMotif = 1;


/*
    Standardgröße:

    2 Meter × 2 Meter
*/

let pictureWidth = 2;

let pictureHeight = 2;


/*
    Transparenz:

    1.0 = komplett sichtbar
    0.5 = halbtransparent
    0.2 = fast durchsichtig
*/

let pictureOpacity = 1.0;


/*
    Position
*/

pictureGroup.position.set(

    0,

    1.5,

    -1.5

);


/*
    Rotation
*/

pictureGroup.rotation.set(

    0,

    0,

    0

);


/*
    Ist das Bild festgestellt?
*/

let locked = false;


/* =====================================================
   BILD LADEN
   ===================================================== */

function loadPicture(number) {


    currentMotif =
        number;


    const loader =
        new THREE.TextureLoader();


    loader.load(

        IMAGES[number],

        function(texture) {


            texture.colorSpace =
                THREE.SRGBColorSpace;


            /*
                Altes Bild entfernen
            */

            if (picture) {

                pictureGroup.remove(
                    picture
                );

                picture.geometry.dispose();

                picture.material.dispose();

            }


            /*
                Quadrat:

                2 × 2 Meter
            */

            const geometry =
                new THREE.PlaneGeometry(

                    pictureWidth,

                    pictureHeight

                );


            const material =
                new THREE.MeshBasicMaterial({

                    map: texture,

                    transparent: true,

                    opacity:
                        pictureOpacity,

                    side:
                        THREE.DoubleSide

                });


            picture =
                new THREE.Mesh(

                    geometry,

                    material

                );


            pictureGroup.add(
                picture
            );


            updateStatus();

        },


        undefined,


        function(error) {

            console.error(
                "Bild konnte nicht geladen werden:",
                error
            );

        }

    );

}


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {


    let lockText =
        locked
        ? "🔒 festgestellt"
        : "🔓 frei";


    document.getElementById(
        "status"
    ).innerText =

        "Motiv "
        +
        currentMotif
        +
        " | "
        +
        pictureWidth.toFixed(1)
        +
        " × "
        +
        pictureHeight.toFixed(1)
        +
        " m | "
        +
        Math.round(
            pictureOpacity * 100
        )
        +
        "% sichtbar | "
        +
        lockText;

}


/* =====================================================
   MOTIV BUTTONS
   ===================================================== */

document.getElementById(
    "motif1"
).onclick = function() {

    loadPicture(1);

};


document.getElementById(
    "motif2"
).onclick = function() {

    loadPicture(2);

};


/* =====================================================
   MR STARTEN
   ===================================================== */

document.getElementById(
    "start"
).onclick = async function() {


    if (!navigator.xr) {

        alert(
            "WebXR wird nicht unterstützt."
        );

        return;

    }


    const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


    if (!supported) {

        alert(
            "Mixed Reality wird nicht unterstützt."
        );

        return;

    }


    const session =
        await navigator.xr.requestSession(

            "immersive-ar",

            {

                requiredFeatures: [
                    "local-floor"
                ],

                optionalFeatures: [
                    "dom-overlay"
                ],

                domOverlay: {
                    root:
                        document.body
                }

            }

        );


    renderer.xr.setReferenceSpaceType(
        "local-floor"
    );


    await renderer.xr.setSession(
        session
    );


    document.getElementById(
        "menu"
    ).style.display =
        "none";

};


/* =====================================================
   CONTROLLER
   ===================================================== */


/*
    Deadzone verhindert leichtes Zittern
*/

function deadzone(value) {

    if (
        Math.abs(value)
        < 0.15
    ) {

        return 0;

    }

    return value;

}


/*
    Controller-Zustand

    damit wir Tasten nur einmal
    pro Klick auslösen
*/

const previousButtons =
    new WeakMap();


function buttonPressed(
    gamepad,
    index
) {


    if (
        !gamepad.buttons[index]
    ) {

        return false;

    }


    const current =
        gamepad.buttons[index].pressed;


    let previous =
        previousButtons.get(
            gamepad
        );


    if (!previous) {

        previous = [];

    }


    const wasPressed =
        previous[index] || false;


    previous[index] =
        current;


    previousButtons.set(
        gamepad,
        previous
    );


    return (
        current &&
        !wasPressed
    );

}


/* =====================================================
   CONTROLLER-LOGIK
   ===================================================== */

function updateControllers() {


    const session =
        renderer.xr.getSession();


    if (!session) {

        return;

    }


    for (
        const inputSource
        of session.inputSources
    ) {


        if (
            !inputSource.gamepad
        ) {

            continue;

        }


        const gamepad =
            inputSource.gamepad;


        /*
            PICO:

            rechter Controller
            = right

            linker Controller
            = left
        */


        if (
            inputSource.handedness
            ===
            "right"
        ) {


            /*
                JOYSTICK

                X =
                links / rechts

                Y =
                oben / unten
            */

            const x =
                deadzone(
                    gamepad.axes[2] || 0
                );


            const y =
                deadzone(
                    gamepad.axes[3] || 0
                );


            /*
                Bild bewegen

                nur wenn NICHT festgestellt
            */

            if (!locked) {


                const movementSpeed =
                    0.025;


                pictureGroup.position.x
                    +=
                    x *
                    movementSpeed;


                pictureGroup.position.y
                    -=
                    y *
                    movementSpeed;

            }


            /*
                A-TASTE

                Bild feststellen
                / freigeben
            */

            if (
                buttonPressed(
                    gamepad,
                    4
                )
            ) {

                locked =
                    !locked;


                updateStatus();

            }


            /*
                B-TASTE

                Transparenz wechseln

                100%
                70%
                40%
                20%
                100%
            */

            if (
                buttonPressed(
                    gamepad,
                    5
                )
            ) {


                if (
                    pictureOpacity
                    ===
                    1.0
                ) {

                    pictureOpacity =
                        0.7;

                }

                else if (
                    pictureOpacity
                    ===
                    0.7
                ) {

                    pictureOpacity =
                        0.4;

                }

                else if (
                    pictureOpacity
                    ===
                    0.4
                ) {

                    pictureOpacity =
                        0.2;

                }

                else {

                    pictureOpacity =
                        1.0;

                }


                if (picture) {

                    picture.material.opacity =
                        pictureOpacity;

                }


                updateStatus();

            }

        }


        /*
            LINKER CONTROLLER
        */

        if (
            inputSource.handedness
            ===
            "left"
        ) {


            /*
                LINKER JOYSTICK:

                hoch/runter
                =
                näher / weiter weg
            */

            const y =
                deadzone(
                    gamepad.axes[3] || 0
                );


            if (!locked) {


                const distanceSpeed =
                    0.03;


                pictureGroup.position.z
                    +=
                    y *
                    distanceSpeed;

            }


            /*
                A-TASTE LINKS

                Bild größer / kleiner
            */

            if (
                buttonPressed(
                    gamepad,
                    4
                )
            ) {


                const factor =
                    pictureWidth > 2.0
                    ? 0.5
                    : 2.0;


                pictureWidth *=
                    factor;


                pictureHeight *=
                    factor;


                /*
                    Sicherheitsgrenzen
                */

                pictureWidth =
                    THREE.MathUtils.clamp(
                        pictureWidth,
                        0.5,
                        4.0
                    );


                pictureHeight =
                    THREE.MathUtils.clamp(
                        pictureHeight,
                        0.5,
                        4.0
                    );


                if (picture) {


                    picture.geometry.dispose();


                    picture.geometry =
                        new THREE.PlaneGeometry(

                            pictureWidth,

                            pictureHeight

                        );

                }


                updateStatus();

            }


            /*
                B-TASTE LINKS

                Bild drehen
            */

            if (
                buttonPressed(
                    gamepad,
                    5
                )
            {


                if (!locked) {

                    pictureGroup.rotation.y
                        +=
                        Math.PI / 12;

                }

            }

        }

    }

}


/* =====================================================
   ANIMATION
   ===================================================== */

renderer.setAnimationLoop(

    function() {


        updateControllers();


        renderer.render(

            scene,

            camera

        );

    }

);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(

    "resize",

    function() {


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


/* =====================================================
   STARTMOTIV
   ===================================================== */

loadPicture(1);

</script>

</body>

</html>
