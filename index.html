<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pico MR Bilder</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: black;
}

canvas {
display: block;
}
</style>
</head>

<body>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";



// -------------------------
// Szene
// -------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


// -------------------------
// Kamera
// -------------------------

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth / window.innerHeight,
0.01,
100
);

camera.position.set(0, 1.6, 0);


// -------------------------
// Renderer
// -------------------------

const renderer = new THREE.WebGLRenderer({
antialias: true,
alpha: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);
document.body.appendChild(
ARButton.createButton(renderer, {
optionalFeatures: ["hit-test", "hand-tracking"]
})
);


// -------------------------
// Licht
// -------------------------

const light = new THREE.AmbientLight(0xffffff, 3);
scene.add(light);


// -------------------------
// BILD
// -------------------------

const loader = new THREE.TextureLoader();

loader.load(
"6E99D71F-9688-4AF0-BDFA-5764592FE23A.PNG",

function(texture) {

// Bild soll scharf dargestellt werden
texture.colorSpace = THREE.SRGBColorSpace;

// Quadratisches Bild:
// EXAKT 2 Meter breit
// EXAKT 2 Meter hoch

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.MeshBasicMaterial({
map: texture,
transparent: true,
side: THREE.DoubleSide
});

const picture = new THREE.Mesh(
geometry,
material
);


// -------------------------
// Position
// -------------------------

// 1,5 m vor dem Benutzer
// auf Augenhöhe

picture.position.set(
0,
1.6,
-1.5
);


scene.add(picture);
},

undefined,

function(error) {
console.error(
"Bild konnte nicht geladen werden:",
error
);
}
);


// -------------------------
// Fenstergröße
// -------------------------

window.addEventListener(
"resize",
function() {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
}
);


// -------------------------
// Render Loop
// -------------------------

renderer.setAnimationLoop(
function() {

renderer.render(
scene,
camera
);
}
);

</script>

</body>
</html>
