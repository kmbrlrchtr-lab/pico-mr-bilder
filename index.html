<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pico MR Bilder</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: black;
}

canvas {
display: block;
}
</style>
</head>

<body>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";



// -------------------------
// Szene
// -------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


// -------------------------
// Kamera
// -------------------------

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth / window.innerHeight,
0.01,
100
);

camera.position.set(0, 1.6, 0);


// -------------------------
// Renderer
// -------------------------

const renderer = new THREE.WebGLRenderer({
antialias: true,
alpha: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);
document.body.appendChild(
ARButton.createButton(renderer, {
optionalFeatures: ["hit-test", "hand-tracking"]
})
);


// -------------------------
// Licht
// -------------------------

const light = new THREE.AmbientLight(0xffffff, 3);
scene.add(light);


// -------------------------
// BILD
// -------------------------

const loader = new THREE.TextureLoader();

loader.load(
"6E99D71F-9688-4AF0-BDFA-5764592FE23A.PNG",

function(texture) {

// Bild soll scharf dargestellt werden
texture.colorSpace = THREE.SRGBColorSpace;

// Quadratisches Bild:
// EXAKT 2 Meter breit
// EXAKT 2 Meter hoch

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.MeshBasicMaterial({
map: texture,
transparent: true,
side: THREE.DoubleSide
});

const picture = new THREE.Mesh(
geometry,
material
);


// -------------------------
// Position
// -------------------------

// 1,5 m vor dem Benutzer
// auf Augenhöhe

picture.position.set(
0,
1.6,
-1.5
);


scene.add(picture);
// ============================
// Handsteuerung
// ============================

let grabbed = false;
let grabOffset = new THREE.Vector3();

let lastPinchCenter = new THREE.Vector3();
let lastTwoHandDistance = 0;

function getHandPoint(frame, inputSource, jointName) {
if (!inputSource.hand) return null;

const joint = inputSource.hand.get(jointName);
if (!joint) return null;

const pose = frame.getJointPose(
joint,
renderer.xr.getReferenceSpace()
);

if (!pose) return null;

return new THREE.Vector3(
pose.transform.position.x,
pose.transform.position.y,
pose.transform.position.z
);
}

function updateHands(frame) {
if (!frame) return;

const session = renderer.xr.getSession();
if (!session) return;

const hands = [];

for (const inputSource of session.inputSources) {
if (inputSource.hand) {
const thumb = getHandPoint(
frame,
inputSource,
"thumb-tip"
);

const index = getHandPoint(
frame,
inputSource,
"index-finger-tip"
);

if (thumb && index) {
const pinchDistance = thumb.distanceTo(index);

if (pinchDistance < 0.035) {
const center = new THREE.Vector3()
.addVectors(thumb, index)
.multiplyScalar(0.5);

hands.push(center);
}
}
}
}

// Eine Hand = Bild verschieben
if (hands.length === 1) {

const hand = hands[0];

if (!grabbed) {
grabbed = true;
lastPinchCenter.copy(hand);
}

const movement = new THREE.Vector3()
.subVectors(hand, lastPinchCenter);

picture.position.x += movement.x;
picture.position.y += movement.y;

lastPinchCenter.copy(hand);
}

// Zwei Hände = Bild skalieren
else if (hands.length >= 2) {

grabbed = false;

const distance = hands[0].distanceTo(hands[1]);

if (lastTwoHandDistance > 0) {

const scaleChange =
distance / lastTwoHandDistance;

picture.scale.multiplyScalar(scaleChange);

// Verhindert extremes Verkleinern/Vergrößern
const scale = THREE.MathUtils.clamp(
picture.scale.x,
0.2,
5
);

picture.scale.setScalar(scale);
}

lastTwoHandDistance = distance;
}

else {
grabbed = false;
lastTwoHandDistance = 0;
}
}

undefined,

function(error) {
console.error(
"Bild konnte nicht geladen werden:",
error
);
}
);


// -------------------------
// Fenstergröße
// -------------------------

window.addEventListener(
"resize",
function() {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
}
);


// -------------------------
// Render Loop
// -------------------------

renderer.setAnimationLoop(
function(time, frame) {

updateHands(frame);

renderer.render(
scene,
camera
);

}
);

</script>

</body>
</html>
