<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PICO 4 – MR Bilder</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    z-index: 9999;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: rgba(20,20,20,0.92);
    color: white;

    padding: 25px;

    border-radius: 20px;

    text-align: center;

    min-width: 280px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.5);
}

#menu h1 {
    margin-top: 0;
}

button {
    display: block;

    width: 100%;

    margin: 10px 0;

    padding: 14px;

    border: none;

    border-radius: 12px;

    font-size: 17px;

    cursor: pointer;
}

#startMR {
    background: #9b59ff;
    color: white;

    font-weight: bold;
}

#motif1 {
    background: white;
    color: black;
}

#motif2 {
    background: white;
    color: black;
}

#status {
    margin-top: 15px;

    font-size: 13px;

    opacity: 0.75;
}

</style>
</head>


<body>


<div id="menu">

    <h1>🥽 PICO MR</h1>

    <button id="motif1">
        🖼️ Mein Bild
    </button>

    <button id="motif2">
        🖼️ MAM-Bild
    </button>

    <button id="startMR">
        🥽 MR STARTEN
    </button>

    <div id="status">
        Motiv 1 ausgewählt
    </div>

</div>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";


/* =====================================================
   BILDER
   ===================================================== */

const IMAGES = {

    1:
    "6E99D71F-9688-4AF0-BDFA-5764592FE23A.PNG",

    2:
    "20Bec6d6-c4fe-4a7d-9ef4-fc91983068c.JPG"

};


/* =====================================================
   THREE.JS
   ===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    window.devicePixelRatio
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled = true;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   BILD-GRUPPE
   ===================================================== */

const pictureGroup =
    new THREE.Group();


scene.add(
    pictureGroup
);


let picture = null;


/* =====================================================
   EINSTELLUNGEN
   ===================================================== */

let currentMotif = 1;

let locked = false;


/*
    Standard:

    2 × 2 Meter
*/

let pictureSize = 2;


/*
    Transparenz

    1.0 = 100 %
    0.7 = 70 %
    0.4 = 40 %
    0.2 = 20 %
*/

let pictureOpacity = 1.0;


/*
    Startposition

    X = links/rechts
    Y = Höhe
    Z = Entfernung
*/

pictureGroup.position.set(
    0,
    1.5,
    -1.5
);


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

    const lock =
        locked
        ? "🔒 festgestellt"
        : "🔓 frei";

    document.getElementById(
        "status"
    ).innerText =

        "Motiv "
        +
        currentMotif
        +
        " | "
        +
        pictureSize.toFixed(1)
        +
        " × "
        +
        pictureSize.toFixed(1)
        +
        " m | "
        +
        Math.round(
            pictureOpacity * 100
        )
        +
        "% | "
        +
        lock;

}


/* =====================================================
   BILD LADEN
   ===================================================== */

function loadPicture(number) {

    currentMotif =
        number;


    const loader =
        new THREE.TextureLoader();


    loader.load(

        IMAGES[number],

        function(texture) {

            texture.colorSpace =
                THREE.SRGBColorSpace;


            /*
                Altes Bild entfernen
            */

            if (picture) {

                pictureGroup.remove(
                    picture
                );

                picture.geometry.dispose();

                picture.material.dispose();

            }


            /*
                Quadratische Fläche
            */

            const geometry =
                new THREE.PlaneGeometry(
                    pictureSize,
                    pictureSize
                );


            const material =
                new THREE.MeshBasicMaterial({

                    map: texture,

                    transparent: true,

                    opacity:
                        pictureOpacity,

                    side:
                        THREE.DoubleSide

                });


            picture =
                new THREE.Mesh(
                    geometry,
                    material
                );


            pictureGroup.add(
                picture
            );


            updateStatus();

        },

        undefined,

        function(error) {

            console.error(
                "Fehler beim Laden:",
                error
            );

        }

    );

}


/* =====================================================
   MOTIV BUTTONS
   ===================================================== */

document.getElementById(
    "motif1"
).addEventListener(
    "click",
    function() {

        loadPicture(1);

    }
);


document.getElementById(
    "motif2"
).addEventListener(
    "click",
    function() {

        loadPicture(2);

    }
);


/* =====================================================
   MR STARTEN
   ===================================================== */

document.getElementById(
    "startMR"
).addEventListener(
    "click",
    async function() {

        try {

            if (!navigator.xr) {

                alert(
                    "Dieser Browser unterstützt kein WebXR."
                );

                return;

            }


            const supported =
                await navigator.xr.isSessionSupported(
                    "immersive-ar"
                );


            if (!supported) {

                alert(
                    "Mixed Reality wird auf diesem Gerät nicht unterstützt."
                );

                return;

            }


            const session =
                await navigator.xr.requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [
                            "local-floor"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root:
                                document.body
                        }

                    }

                );


            renderer.xr.setReferenceSpaceType(
                "local-floor"
            );


            await renderer.xr.setSession(
                session
            );


            document.getElementById(
                "menu"
            ).style.display =
                "none";


            session.addEventListener(
                "end",
                function() {

                    document.getElementById(
                        "menu"
                    ).style.display =
                        "block";

                }
            );


        }

        catch(error) {

            console.error(
                "MR konnte nicht gestartet werden:",
                error
            );

            alert(
                "MR konnte nicht gestartet werden."
            );

        }

    }
);


/* =====================================================
   CONTROLLER
   ===================================================== */


/*
    Kleine Joystickbewegungen ignorieren
*/

function deadzone(value) {

    if (
        Math.abs(value) < 0.15
    ) {

        return 0;

    }

    return value;

}


/*
    Bereits gedrückte Buttons merken
*/

const buttonStates =
    new WeakMap();


function justPressed(
    gamepad,
    index
) {

    if (
        !gamepad.buttons[index]
    ) {

        return false;

    }


    const pressed =
        gamepad.buttons[index].pressed;


    let state =
        buttonStates.get(
            gamepad
        );


    if (!state) {

        state = [];

    }


    const previous =
        state[index] || false;


    state[index] =
        pressed;


    buttonStates.set(
        gamepad,
        state
    );


    return (
        pressed &&
        !previous
    );

}


/* =====================================================
   CONTROLLER-STEUERUNG
   ===================================================== */

function updateControllers() {

    const session =
        renderer.xr.getSession();


    if (!session) {

        return;

    }


    for (
        const inputSource
        of session.inputSources
    ) {


        if (
            !inputSource.gamepad
        ) {

            continue;

        }


        const gamepad =
            inputSource.gamepad;


        /* =============================================
           RECHTER CONTROLLER
           ============================================= */

        if (
            inputSource.handedness
            ===
            "right"
        ) {


            /*
                RECHTER JOYSTICK

                X =
                links / rechts

                Y =
                hoch / runter
            */

            const x =
                deadzone(
                    gamepad.axes[2] || 0
                );


            const y =
                deadzone(
                    gamepad.axes[3] || 0
                );


            if (!locked) {

                /*
                    Bewegungsgeschwindigkeit
                */

                const speed =
                    0.025;


                pictureGroup.position.x
                    +=
                    x * speed;


                pictureGroup.position.y
                    -=
                    y * speed;

            }


            /*
                A-TASTE

                FESTSTELLEN
            */

            if (
                justPressed(
                    gamepad,
                    4
                )
            ) {

                locked =
                    !locked;

                updateStatus();

            }


            /*
                B-TASTE

                TRANSPARENZ
            */

            if (
                justPressed(
                    gamepad,
                    5
                )
            ) {


                if (
                    pictureOpacity
                    ===
                    1.0
                ) {

                    pictureOpacity =
                        0.7;

                }

                else if (
                    pictureOpacity
                    ===
                    0.7
                ) {

                    pictureOpacity =
                        0.4;

                }

                else if (
                    pictureOpacity
                    ===
                    0.4
                ) {

                    pictureOpacity =
                        0.2;

                }

                else {

                    pictureOpacity =
                        1.0;

                }


                if (picture) {

                    picture.material.opacity =
                        pictureOpacity;

                }


                updateStatus();

            }

        }


        /* =============================================
           LINKER CONTROLLER
           ============================================= */

        if (
            inputSource.handedness
            ===
            "left"
        ) {


            /*
                LINKER JOYSTICK

                hoch/runter:

                näher / weiter weg
            */

            const y =
                deadzone(
                    gamepad.axes[3] || 0
                );


            if (!locked) {

                const distanceSpeed =
                    0.03;


                pictureGroup.position.z
                    +=
                    y *
                    distanceSpeed;

            }
/*
    LINKER JOYSTICK LINKS / RECHTS

    Bild kippen
*/

const xTilt =
    deadzone(
        gamepad.axes[2] || 0
    );

if (!locked) {

    const tiltSpeed =
        0.025;

    pictureGroup.rotation.x
        +=
        xTilt *
        tiltSpeed;

}

            /*
                A-TASTE LINKS

                GRÖSSE
            */

            if (
                justPressed(
                    gamepad,
                    4
                )
            ) {


                if (
                    pictureSize < 2
                ) {

                    pictureSize =
                        2;

                }

                else if (
                    pictureSize < 3
                ) {

                    pictureSize =
                        3;

                }

                else {

                    pictureSize =
                        1;

                }


                if (picture) {

                    picture.geometry.dispose();


                    picture.geometry =
                        new THREE.PlaneGeometry(
                            pictureSize,
                            pictureSize
                        );

                }


                updateStatus();

            }


            /*
                B-TASTE LINKS

                DREHEN
            */

            if (
                justPressed(
                    gamepad,
                    5
                )
            ) {


                if (!locked) {

                    pictureGroup.rotation.y
                        +=
                        THREE.MathUtils.degToRad(
                            15
                        );

                }

            }

        }

    }

}


/* =====================================================
   ANIMATION
   ===================================================== */

renderer.setAnimationLoop(
    function() {

        updateControllers();

        renderer.render(
            scene,
            camera
        );

    }
);


/* =====================================================
   FENSTERGRÖSSE
   ===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   STARTBILD
   ===================================================== */

loadPicture(1);

updateStatus();

</script>

</body>
</html>
